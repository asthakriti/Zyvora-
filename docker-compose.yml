services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ecommerce_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_backend"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    container_name: ecommerce-backend
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecommerce_backend
    volumes:
      - .:/app
    # Apply database migrations first, then start the server.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 9000 --reload"

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: